# Firebase App Hosting config (Cloud Run). This is not classic Firebase Hosting.
# firebase.json stays Firestore-only; do not put secrets or service-account JSON here.
#
# Region is chosen when the backend is created (Console or CLI), not in this file.
# europe-west6 (Zurich) is not an App Hosting location as of 2026-09.
# Closest supported region: europe-west4 (Netherlands).
# Other supported locations: us-central1, us-east4, us-east5, asia-east1, asia-southeast1.
# Firebase project: ticketsystem-570a1
#
# Expected Cloud Secret Manager names (values live in Secret Manager, not in git).
# App Hosting reserves the FIREBASE_ secret-id prefix, so these ids use TICKETS_*.
# The variable: names below stay NEXT_PUBLIC_FIREBASE_* and FIREBASE_ADMIN_*.
#   TICKETS_API_KEY
#   TICKETS_AUTH_DOMAIN
#   TICKETS_PROJECT_ID
#   TICKETS_STORAGE_BUCKET
#   TICKETS_MESSAGING_SENDER_ID
#   TICKETS_APP_ID
#   TICKETS_ADMIN_PROJECT_ID
#   TICKETS_ADMIN_CLIENT_EMAIL
#   TICKETS_ADMIN_PRIVATE_KEY
#
# Create them in the Firebase console (App Hosting → Settings → Environment)
# or with: firebase apphosting:secrets:set SECRET_NAME --project ticketsystem-570a1
#
# NEXT_PUBLIC_* is inlined into the browser bundle, so those secrets are BUILD + RUNTIME.
# FIREBASE_ADMIN_* is server-only. The production build does not read Admin credentials,
# so those secrets are RUNTIME only.

runConfig:
  # Small MVP: 1 vCPU, 512 MiB, default Cloud Run concurrency, scale to zero.
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 4

env:
  # --- Client (browser). Secret ids use TICKETS_* (FIREBASE_ is reserved). ---
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: TICKETS_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: TICKETS_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: TICKETS_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: TICKETS_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: TICKETS_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: TICKETS_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # --- Admin SDK (server only). Never use a NEXT_PUBLIC_ name for these. ---
  - variable: FIREBASE_ADMIN_PROJECT_ID
    secret: TICKETS_ADMIN_PROJECT_ID
    availability:
      - RUNTIME

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: TICKETS_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: TICKETS_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
